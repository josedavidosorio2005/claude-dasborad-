# deploy/docker-compose.prod.yml — Compose de PRODUCCION para la instancia AWS.
#
# A diferencia del docker-compose.yml de la raiz (que construye la imagen), este
# solo la DESCARGA de Amazon ECR. Lo usa el pipeline de GitHub Actions:
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Colocar este archivo (renombrado a docker-compose.yml), app.env y
# deploy/Caddyfile en /opt/inconexion/ de la instancia. Ver AWS_DEPLOY_REPORT.md.

services:
  app:
    # La define el pipeline: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/inconexion:latest
    image: ${INCONEXION_IMAGE:-inconexion:latest}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - path: app.env
        format: raw
    environment:
      DB_PATH: /app/server/data/inconexion.db
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - inconexion-data:/app/server/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  inconexion-data:
  caddy-data:
  caddy-config:
