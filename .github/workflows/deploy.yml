name: Deploy a AWS

# Se dispara SOLO cuando el workflow "CI" termina OK en la rama main.
# Asi el deploy nunca corre sin que las pruebas hayan pasado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write   # para autenticacion OIDC con AWS (sin claves de larga vida)
  contents: read

jobs:
  deploy:
    # Fase 151: solo despliega una corrida de CI que venga de un push a
    # main de ESTE repositorio.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Sin `environment:` — el deploy es continuo sin reviewers, y declarar un
    # environment cambia el `sub` del token OIDC a `repo:ORG/REPO:environment:...`,
    # que no casa con la trust policy del rol (`...:ref:refs/heads/main`).
    # Si en el futuro se quiere gating manual: reponer `environment: produccion`
    # Y añadir ese `sub` a la condición del rol inconexion-github-deploy.

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: inconexion
      # Fase 139 (429 al bajar node): solo un booleano, nunca el token.
      HAY_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2

      # Sin los 2 secretos se salta; el paso de build elige el registro de
      # node (mirror.gcr.io, ECR Public, Docker Hub anonimo).
      - name: Login en Docker Hub (solo si existen los secretos)
        if: env.HAY_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # Fase 153 (429 de public.ecr.aws, "Data limit exceeded"): antes del
          # build se bajan las 2 imagenes base de node del primer registro que
          # las entregue (2 intentos cada una), en este orden: Docker Hub con
          # sesion (solo si existen los secretos), mirror.gcr.io, ECR Public y
          # Docker Hub anonimo. El Dockerfile no cambia: solo NODE_REGISTRY.
          CANDIDATOS="mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library"
          if [ "$HAY_DOCKERHUB" = "true" ]; then CANDIDATOS="docker.io/library mirror.gcr.io/library public.ecr.aws/docker/library"; fi
          NODE_REGISTRY=""
          for REG in $CANDIDATOS; do
            TODAS=1
            for IMG in node:22-bookworm node:22-bookworm-slim; do
              BAJO=0
              for INTENTO in 1 2; do
                if docker pull -q "$REG/$IMG" > /dev/null 2>&1; then BAJO=1; break; fi
                echo "No se pudo bajar $REG/$IMG (intento $INTENTO de 2)"
                sleep 10
              done
              if [ "$BAJO" != 1 ]; then TODAS=0; break; fi
            done
            if [ "$TODAS" = 1 ]; then NODE_REGISTRY="$REG"; break; fi
          done
          if [ -z "$NODE_REGISTRY" ]; then echo "::error::Ningun registro entrego las 2 imagenes base de node"; exit 1; fi
          echo "Registro de la imagen base: $NODE_REGISTRY"
          for IMG in node:22-bookworm node:22-bookworm-slim; do
            echo "  $IMG -> $(docker image inspect --format '{{index .RepoDigests 0}}' "$NODE_REGISTRY/$IMG")"
          done
          docker build --build-arg NODE_REGISTRY="$NODE_REGISTRY" -f server/Dockerfile -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE:$SHA" >> "$GITHUB_ENV"

      # El puerto 22 de la instancia está restringido a la IP fija del operador
      # (los runners de GitHub tienen IP dinámica). Aquí añadimos SOLO la IP de
      # este runner al firewall, justo para este deploy, y la quitamos al final
      # (paso `Cerrar SSH (22)`, if: always()). El 22 nunca queda abierto a todo.
      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          # Guardamos el estado actual para revertirlo tal cual al terminar.
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          # put-instance-public-ports REEMPLAZA todo el set de reglas: reconstruimos
          # las actuales sin cambios y sólo a la del 22/tcp le añadimos la IP del runner.
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          echo "Nuevo set: $NEW"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      - name: Desplegar en la instancia por SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}
            # Fase 111 (hallazgo real: el deploy fallo por "no space left on
            # device" al extraer la imagen nueva): `docker image prune -f`
            # (mas abajo) solo borra imagenes SIN TAG (dangling) -- cada
            # imagen de cada deploy anterior queda tageada por su SHA
            # unico, asi que nunca se consideraba dangling y se acumulaban
            # sin limite. `docker system prune -af` SI borra cualquier
            # imagen/contenedor/red/cache de build que no este en uso por
            # un contenedor activo -- la imagen que sigue corriendo (la
            # version actual, antes de este pull) no se toca, solo las
            # decenas de versiones viejas huerfanas. Nunca toca volumenes
            # (la base de datos vive en un volumen, no en la imagen).
            docker system prune -af
            export INCONEXION_IMAGE='${{ env.IMAGE }}'
            docker compose pull
            docker compose up -d
            # Espera a que el health check pase (hasta ~60s) y limpia imagenes viejas.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo "OK healthy"; break; fi
              sleep 3
            done
            curl -fsS http://127.0.0.1:3000/api/health
            docker image prune -f

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
