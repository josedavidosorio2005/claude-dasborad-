name: Diagnostico - ORLANT Trafico agosto 2026 (produccion)

# Disparo manual unicamente. Mismo patron de acceso que
# diagnostico-aht-6-clientes-produccion.yml / diagnostico-dashboard-produccion.yml
# (rol OIDC, apertura temporal del puerto 22 solo para la IP de este runner)
# -- SOLO LECTURA: ningun paso escribe en la base de datos. Fase 66, Paso 4:
# antes de que el cliente decida subir los datos reales de agosto 2026 de
# ORLANT con la nueva plantilla unificada (Llamadas + WhatsApp), hay que
# confirmar que trae produccion HOY para ORLANT en Trafico de Llamadas
# (calidad_nivel_servicio_diario) y Trafico de WhatsApp (trafico_whatsapp)
# para ese periodo -- para no pisar ni duplicar nada al subir.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      - name: Correr el diagnostico (solo lectura) dentro del contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e JWT_SECRET="dummy-no-usado-diagnostico-32-caracteres" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              function out(titulo, data) {
                console.log("\n=== " + titulo + " ===");
                console.log(JSON.stringify(data, null, 2));
              }

              out("Trafico de Llamadas ORLANT agosto 2026 -- totales", db.prepare(
                "SELECT COUNT(*) filas, COUNT(DISTINCT skillName) skills, MIN(fecha) minFecha, MAX(fecha) maxFecha, SUM(totalLlamadas) totalLlamadas, SUM(contestadas) contestadas, SUM(llamadasAbandonadas) abandonadas, SUM(CASE WHEN ahtSegundos IS NOT NULL THEN 1 ELSE 0 END) filasConAht FROM calidad_nivel_servicio_diario WHERE campana = ? AND fecha LIKE ?"
              ).get("ORLANT", "2026-08%"));

              out("Trafico de Llamadas ORLANT agosto 2026 -- por skill", db.prepare(
                "SELECT skillName, COUNT(*) filas, MIN(fecha) minFecha, MAX(fecha) maxFecha, SUM(totalLlamadas) totalLlamadas, SUM(contestadas) contestadas, SUM(llamadasAbandonadas) abandonadas FROM calidad_nivel_servicio_diario WHERE campana = ? AND fecha LIKE ? GROUP BY skillName"
              ).all("ORLANT", "2026-08%"));

              out("Trafico de Llamadas -- filas ORLANT en TODOS los periodos (por si hay datos fuera de agosto)", db.prepare(
                "SELECT MIN(fecha) minFecha, MAX(fecha) maxFecha, COUNT(*) filas, COUNT(DISTINCT skillName) skills FROM calidad_nivel_servicio_diario WHERE campana = ?"
              ).get("ORLANT"));

              out("Trafico de WhatsApp ORLANT agosto 2026 -- totales", db.prepare(
                "SELECT COUNT(*) filas, COUNT(DISTINCT colaWhatsapp) colas, MIN(fechaInicio) minFecha, MAX(fechaFin) maxFecha, SUM(totalWhatsapp) totalWhatsapp, SUM(contestados) contestados, SUM(abandonados) abandonados FROM trafico_whatsapp WHERE campana = ? AND fechaInicio LIKE ?"
              ).get("ORLANT", "2026-08%"));

              out("Trafico de WhatsApp ORLANT agosto 2026 -- por cola", db.prepare(
                "SELECT colaWhatsapp, fechaInicio, fechaFin, totalWhatsapp, contestados, abandonados FROM trafico_whatsapp WHERE campana = ? AND fechaInicio LIKE ? ORDER BY colaWhatsapp"
              ).all("ORLANT", "2026-08%"));

              out("Trafico de WhatsApp -- filas ORLANT en TODOS los periodos", db.prepare(
                "SELECT MIN(fechaInicio) minFecha, MAX(fechaFin) maxFecha, COUNT(*) filas, COUNT(DISTINCT colaWhatsapp) colas FROM trafico_whatsapp WHERE campana = ?"
              ).get("ORLANT"));

              out("trafico_skill_mapeo -- entradas mapeadas a ORLANT", db.prepare(
                "SELECT skillName, sede FROM trafico_skill_mapeo WHERE campana = ? ORDER BY skillName"
              ).all("ORLANT"));

              console.log("\n=== FIN DIAGNOSTICO ===");
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
