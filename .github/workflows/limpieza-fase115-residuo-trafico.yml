name: Limpieza residuo de prueba Fase 67 (Trafico de Llamadas, revisar/borrar/escanear)

# Fase 115 (autorizado explicitamente, 2026-10-04): comparar agosto contra
# el archivo real de Edwin encontro un residuo de la Fase 67 en produccion
# -- 2 filas sinteticas del 2026-08-17 (CALL INBOUND ORLANT 3P / CALL
# INBOUND ORLANT GENERAL), cargadas como "llenado-agosto-produccion.xlsx" y
# marcadas "Fase 67 - prueba real (borrar automatico)" en su momento, nunca
# borradas (ver docs/pendientes.md). Ya se confirmo (modo revisar) y borro
# (modo borrar) ese residuo puntual.
#
# Este workflow es de UN SOLO USO (no un borrador general de filas): corre
# server/scripts/limpieza-fase115-residuo-trafico.js (filtro EXACTO y fijo
# escrito en el propio script, nunca parametrizable desde aqui) o
# server/scripts/escaneo-fase115-residuos-prueba.js (modo escanear, SOLO
# LECTURA, nunca borra nada) -- reutiliza EXACTAMENTE el mismo mecanismo ya
# auditado de respaldo-produccion.yml/salud-servidor.yml (rol OIDC, apertura
# temporal del puerto 22 solo para la IP de este runner, cerrado al final
# con if: always(), secrets SSH de siempre, docker compose exec DENTRO del
# contenedor ya corriendo) -- no abre acceso nuevo.
#
# Modos:
#   - revisar (default): SOLO LECTURA. Cuenta e imprime las filas que
#                         calzan con el filtro exacto del residuo de la
#                         Fase 67. Nunca borra nada.
#   - borrar:             el script vuelve a contar antes de borrar y
#                         ABORTA si no son exactamente las esperadas; si
#                         coinciden, borra esas filas exactas y recalcula
#                         el agregado mensual de ORLANT/2026-08.
#   - escanear:           SOLO LECTURA. Inventario de posibles residuos de
#                         prueba en TODAS las tablas de carga real (Trafico
#                         de Llamadas/WhatsApp, Agendas, Tipificacion,
#                         Inasistencia, Efectividad de Agendamiento/Citas,
#                         cargas generales) -- nunca borra nada, es un
#                         inventario para decidir despues.
#
# El repo es PUBLICO: los scripts solo imprimen conteos/totales/metadatos de
# carga (nunca una columna de dato real de cliente).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Que hacer'
        type: choice
        required: true
        default: revisar
        options:
          - revisar
          - borrar
          - escanear

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  limpieza:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # ── Modo "revisar": SOLO LECTURA ──────────────────────────────────────
      - name: 'revisar: contar las filas que calzan con el filtro exacto'
        if: inputs.modo == 'revisar'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T app node scripts/limpieza-fase115-residuo-trafico.js --revisar

      # ── Modo "borrar": borra las filas exactas y recalcula el mensual ────
      - name: 'borrar: borrar el residuo exacto y recalcular ORLANT/2026-08'
        if: inputs.modo == 'borrar'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T app node scripts/limpieza-fase115-residuo-trafico.js --borrar

      # ── Modo "escanear": SOLO LECTURA, inventario en todas las tablas ────
      - name: 'escanear: inventario de posibles residuos de prueba (todas las tablas)'
        if: inputs.modo == 'escanear'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T app node scripts/escaneo-fase115-residuos-prueba.js

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
