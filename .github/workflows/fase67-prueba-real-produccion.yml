name: Fase 67 - prueba real de carga (Llamadas + WhatsApp) en produccion

# Disparo manual unicamente. Mismo mecanismo de acceso que
# verificacion-plantilla-produccion.yml (rol OIDC, apertura temporal del
# puerto 22 SOLO para crear/borrar el usuario temporal directo en la base
# de datos -- nunca via la API, para no dejar una fila de auditoria como si
# la hubiera creado un humano).
#
# A diferencia de ese workflow (que sube datos de PRUEBA desechables), este
# es la UNICA escritura real permitida en produccion para la Fase 67: sube
# el archivo REAL de agosto 2026 de ORLANT (Llamadas + WhatsApp) por la
# interfaz real -- y el script (.github/scripts/verificar-fase67-produccion-
# carga-real.js) primero COMPARA fila por fila y columna por columna contra
# lo que YA tiene produccion (via los endpoints de lectura reales, con el
# mismo parseo puro que usa la app). Si hay CUALQUIER diferencia, aborta
# ANTES de subir nada. Solo si es identico, sube el archivo (acepta el
# aviso "se reemplazaran N registros" de voz, como haria un operador real)
# y vuelve a comparar despues.
#
# Este workflow NUNCA borra Trafico/Gestion de base/Monitoreos -- esa data
# es la real de produccion. Lo UNICO que borra al terminar es el usuario
# temporal.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  prueba-real:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TEMP_USER: fase67_prueba_real_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar contrasena temporal (enmascarada de inmediato)
        id: genpw
        run: |
          set -euo pipefail
          PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 22)"
          echo "::add-mask::$PW"
          echo "password=$PW" >> "$GITHUB_OUTPUT"

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # Rol AUX_ADMIN (nunca ADMIN) + perms minimos: cargarDatos (para
      # entrar a "Cargar Datos" y subir) y campana_ORLANT (para leer via
      # los endpoints /calidad/nivel-servicio/diario, /calidad/trafico/
      # whatsapp, /monitoreos -- todos exigen campaignAccess).
      - name: Crear usuario temporal directo en la base de datos
        uses: appleboy/ssh-action@v1
        env:
          TEMP_PW: ${{ steps.genpw.outputs.password }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TEMP_PW
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_PW="$TEMP_PW" -e TEMP_USER="${{ env.TEMP_USER }}" \
              -e JWT_SECRET="dummy-no-usado-fase67-temporal-32-caracteres" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const bcrypt = require("bcryptjs");
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const d = new Date();
              const now = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
              const hash = bcrypt.hashSync(process.env.TEMP_PW, 10);
              db.prepare(
                "INSERT INTO users (nombre, user, rol, active, password_hash, perms, asesorCampana, createdAt) VALUES (?,?,?,1,?,?,NULL,?)"
              ).run("Fase 67 - prueba real (borrar automatico)", process.env.TEMP_USER, "AUX_ADMIN", hash, JSON.stringify({ cargarDatos: true, campana_ORLANT: true }), now);
              const row = db.prepare("SELECT id, user, rol, createdAt FROM users WHERE user = ?").get(process.env.TEMP_USER);
              console.log("USUARIO_TEMPORAL_CREADO " + JSON.stringify(row));
            '

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Comparar y, solo si es identico, subir el archivo real de agosto 2026
        id: prueba
        env:
          TEMP_PW: ${{ steps.genpw.outputs.password }}
          PROD_URL: https://inconexionpruebasclaude.duckdns.org
          ARTIFACTS_DIR: ${{ runner.temp }}/fase67-artifacts
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          node .github/scripts/verificar-fase67-produccion-carga-real.js

      - name: Subir capturas y archivos como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase67-prueba-real-produccion-${{ github.run_id }}
          path: ${{ runner.temp }}/fase67-artifacts/**
          retention-days: 30
          if-no-files-found: warn

      # SIEMPRE borra el usuario temporal. NUNCA toca Trafico/Gestion de
      # base/Monitoreos -- esa es la data real de produccion.
      - name: Borrar el usuario temporal (siempre, pase lo que pase arriba)
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_USER="${{ env.TEMP_USER }}" \
              -e JWT_SECRET="dummy-no-usado-fase67-temporal-32-caracteres" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const info = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_USER);
              console.log("USUARIO_TEMPORAL_BORRADO " + JSON.stringify({ filasBorradas: info.changes, at: new Date().toISOString() }));
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
