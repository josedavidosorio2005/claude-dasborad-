name: Verificacion QA - previsualizar dashboard, filtros y colores en produccion

# Disparo manual unicamente. Reutiliza EXACTAMENTE el mismo mecanismo que
# deploy.yml/verificacion-plantilla-produccion.yml (rol OIDC, apertura
# temporal del puerto 22 solo para la IP de este runner).
#
# Verifica en produccion real (PR "Boton Previsualizar dashboard + mejorar
# filtros y colores", 2026-09-16):
#   1. El boton "Previsualizar" del listado de Dashboards de Cliente abre el
#      dashboard REAL de al menos 2 campanas (ORLANT, ALBERTO LINERO GO), y
#      que un AUX_ADMIN no ve ese boton ni la seccion (isFullAdmin-only).
#   2. El filtro de categorias y el de fechas de Gestion de base funcionan,
#      y el color de una categoria es estable entre dos aperturas del
#      dashboard — sobre una carga de PRUEBA subida por este mismo workflow
#      a ALBERTO LINERO GO (periodo 2027-06, calidad:false = "solo Gestion
#      de base"), por el flujo real (plantilla consolidada).
#   3. El filtro de asesor/fecha de Calidad funciona sobre datos REALES ya
#      existentes en ORLANT — de SOLO LECTURA, este workflow nunca escribe
#      ni borra nada de esas filas reales.
#
# Dos usuarios TEMPORALES (creados y borrados directo en la base de datos,
# nunca via la API): uno ADMIN (el boton Previsualizar y
# /api/dashboards/config* son isFullAdmin-only, AUX_ADMIN no alcanza), uno
# AUX_ADMIN (para confirmar que NO ve nada de esto). Las contrasenas se
# generan en este job y se enmascaran de inmediato.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TEMP_ADMIN_USER: verif_filtros_admin_${{ github.run_id }}
      TEMP_AUX_USER: verif_filtros_aux_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar contrasenas temporales (enmascaradas de inmediato)
        id: genpw
        run: |
          set -euo pipefail
          PW1="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 22)"
          PW2="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 22)"
          echo "::add-mask::$PW1"
          echo "::add-mask::$PW2"
          echo "admin_password=$PW1" >> "$GITHUB_OUTPUT"
          echo "aux_password=$PW2" >> "$GITHUB_OUTPUT"
          echo "Contrasenas temporales generadas (no se imprimen)."

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # Inserta los 2 usuarios temporales DIRECTO en la tabla users (nunca
      # via POST /api/users) -- asi no dejan una fila CREADO en el historial
      # de auditoria como si lo hubiera hecho un administrador real. Rol
      # ADMIN (necesario para /api/dashboards/config* e isFullAdmin) y rol
      # AUX_ADMIN (para confirmar que NO alcanza).
      - name: Crear los 2 usuarios temporales directo en la base de datos
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_PW: ${{ steps.genpw.outputs.admin_password }}
          AUX_PW: ${{ steps.genpw.outputs.aux_password }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_PW,AUX_PW
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e ADMIN_PW="$ADMIN_PW" -e AUX_PW="$AUX_PW" \
              -e TEMP_ADMIN_USER="${{ env.TEMP_ADMIN_USER }}" -e TEMP_AUX_USER="${{ env.TEMP_AUX_USER }}" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const bcrypt = require("bcryptjs");
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const d = new Date();
              const now = pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
              const insertar = (user, rol, pw) => {
                const hash = bcrypt.hashSync(pw, 10);
                db.prepare(
                  "INSERT INTO users (nombre, user, rol, active, password_hash, perms, asesorCampana, createdAt) VALUES (?,?,?,1,?,?,NULL,?)"
                ).run("Verificacion Temporal QA Filtros (borrar automatico)", user, rol, hash, JSON.stringify({}), now);
              };
              insertar(process.env.TEMP_ADMIN_USER, "ADMIN", process.env.ADMIN_PW);
              insertar(process.env.TEMP_AUX_USER, "AUX_ADMIN", process.env.AUX_PW);
              console.log("USUARIOS_TEMPORALES_CREADOS " + JSON.stringify({ admin: process.env.TEMP_ADMIN_USER, aux: process.env.TEMP_AUX_USER }));
            '

      - name: Instalar Playwright (Chromium) y xlsx (solo para leer/armar el .xlsx de esta verificacion)
        run: |
          npm install --no-save playwright@1.63.0 xlsx@0.18.5
          npx playwright install --with-deps chromium

      - name: Verificar previsualizacion + filtros + colores en produccion
        id: verificacion
        env:
          TEMP_ADMIN_PW: ${{ steps.genpw.outputs.admin_password }}
          TEMP_AUX_PW: ${{ steps.genpw.outputs.aux_password }}
          PROD_URL: https://inconexionpruebasclaude.duckdns.org
          ARTIFACTS_DIR: ${{ runner.temp }}/verificacion-filtros-artifacts
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          node .github/scripts/verificar-filtros-colores-produccion.js
        # El script espera TEMP_ADMIN_USER/TEMP_AUX_USER (ya en env del job)
        # y TEMP_ADMIN_PW/TEMP_AUX_PW (recien seteadas arriba).

      - name: Subir capturas como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-filtros-colores-${{ github.run_id }}
          path: ${{ runner.temp }}/verificacion-filtros-artifacts/**
          retention-days: 30
          if-no-files-found: warn

      # Corre SIEMPRE. Borra UNICAMENTE la carga de prueba de ALBERTO LINERO
      # GO (cliente + periodo 2027-06, inconfundible) y los 2 usuarios
      # temporales -- JAMAS toca ninguna fila de ORLANT (los datos reales
      # que este workflow solo lee para probar el filtro de Calidad).
      - name: Borrar la carga de prueba y los usuarios temporales (siempre, pase lo que pase arriba)
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_ADMIN_USER="${{ env.TEMP_ADMIN_USER }}" -e TEMP_AUX_USER="${{ env.TEMP_AUX_USER }}" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const carga = db.prepare("DELETE FROM dashboard_cargas WHERE cliente = ? AND periodo = ?")
                .run("ALBERTO LINERO GO", "2027-06");
              const u1 = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_ADMIN_USER);
              const u2 = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_AUX_USER);
              console.log("LIMPIEZA " + JSON.stringify({
                cargaPruebaAlbertoLineroGoBorradas: carga.changes,
                usuarioAdminBorrado: u1.changes,
                usuarioAuxBorrado: u2.changes,
              }));
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
