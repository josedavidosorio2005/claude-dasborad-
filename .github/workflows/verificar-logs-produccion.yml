name: Verificacion - errores reales en logs de produccion (solo lectura)

# Disparo manual unicamente. Rol OIDC (mismo mecanismo que el resto), pero
# a diferencia de audit-instance.yml/deploy.yml esta corrida NUNCA abre el
# puerto 22 ni toca la instancia -- solo lee CloudWatch Logs (un servicio
# de AWS aparte), asi que no comparte el grupo de concurrencia con el
# despliegue.
#
# Fase 72 (auditoria de seguridad): busca errores/excepciones reales de
# produccion de las ultimas 24h en los grupos de logs que ya existen (ver
# PROGRESS.md, seccion 6.x -- CloudWatch Agent activo desde antes de esta
# fase): /inconexion/prod/docker (contenedor de la app) y
# /inconexion/prod/backup (backup diario). Nunca escribe ni borra nada en
# AWS.
#
# Fase 97 (el repo es publico): el resultado impreso es SOLO conteo, tamano
# del JSON (bytes) y rango de fechas -- nunca la linea de log cruda (puede
# traer nombres, correos, IPs o filas de datos reales). El JSON descargado
# se borra al final de cada paso, nunca se sube como artefacto del run. Si
# hace falta ver el texto real de un error, se revisa directo en CloudWatch
# (o desde el PC con credenciales de AWS), nunca por este log de GitHub
# Actions, que cualquiera puede leer al ser un repo publico.
on:
  workflow_dispatch:
    inputs:
      horas_atras:
        description: 'Cuantas horas hacia atras buscar (default 24)'
        required: false
        default: '24'

permissions:
  id-token: write
  contents: read

jobs:
  verificar-logs:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Errores en /inconexion/prod/docker (contenedor de la app)
        # Fase 102 (endurecimiento): el input se pasa por env, nunca
        # interpolado directo dentro de run: -- aunque hoy nadie manda algo
        # distinto de un numero, esto evita que un valor con comillas/
        # backticks/`$(...)` termine ejecutandose como shell.
        env:
          HORAS_ATRAS_INPUT: ${{ github.event.inputs.horas_atras }}
        run: |
          set -euo pipefail
          HORAS="${HORAS_ATRAS_INPUT:-24}"
          DESDE_MS=$(( $(date +%s%3N) - HORAS * 3600 * 1000 ))
          echo "Buscando desde hace ${HORAS}h en /inconexion/prod/docker ..."
          # OJO: nunca "|| echo '[]'" aqui -- eso esconderia un AccessDenied
          # (o cualquier otro fallo real de la llamada) como si fuera "0
          # eventos encontrados". Si el comando falla, el paso debe fallar.
          aws logs filter-log-events \
            --region "$AWS_REGION" \
            --log-group-name /inconexion/prod/docker \
            --start-time "$DESDE_MS" \
            --filter-pattern '?ERROR ?error ?Error ?Exception ?"uncaughtException" ?"unhandledRejection"' \
            --query 'events[].{t:timestamp,m:message}' \
            --output json > docker-errores.json
          # El repo es publico: nunca se imprime la linea de log cruda (puede
          # traer nombres, correos, IPs o filas de datos reales) -- solo
          # conteo, tamano total (bytes) y rango de fechas. El archivo se
          # borra al terminar el paso, nunca se sube como artefacto.
          COUNT=$(jq 'length' docker-errores.json)
          echo "Eventos encontrados: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            BYTES=$(wc -c < docker-errores.json)
            DESDE_MS_EV=$(jq -r '[.[].t] | min | floor' docker-errores.json)
            HASTA_MS_EV=$(jq -r '[.[].t] | max | floor' docker-errores.json)
            echo "Tamano del JSON (bytes): $BYTES"
            echo "Rango de fechas: $(date -u -d "@$((DESDE_MS_EV/1000))" +"%Y-%m-%dT%H:%M:%SZ") a $(date -u -d "@$((HASTA_MS_EV/1000))" +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          rm -f docker-errores.json

      - name: Errores en /inconexion/prod/backup (backup diario)
        env:
          HORAS_ATRAS_INPUT: ${{ github.event.inputs.horas_atras }}
        run: |
          set -euo pipefail
          HORAS="${HORAS_ATRAS_INPUT:-24}"
          DESDE_MS=$(( $(date +%s%3N) - HORAS * 3600 * 1000 ))
          echo "Buscando desde hace ${HORAS}h en /inconexion/prod/backup ..."
          # OJO: nunca "|| echo '[]'" aqui -- ver el comentario del paso de arriba.
          aws logs filter-log-events \
            --region "$AWS_REGION" \
            --log-group-name /inconexion/prod/backup \
            --start-time "$DESDE_MS" \
            --filter-pattern '?Fallo ?FALLO ?error ?Error' \
            --query 'events[].{t:timestamp,m:message}' \
            --output json > backup-errores.json
          # Mismo criterio de arriba: solo conteo/tamano/fechas, nunca la
          # linea de log cruda -- el repo es publico.
          COUNT=$(jq 'length' backup-errores.json)
          echo "Eventos encontrados: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            BYTES=$(wc -c < backup-errores.json)
            DESDE_MS_EV=$(jq -r '[.[].t] | min | floor' backup-errores.json)
            HASTA_MS_EV=$(jq -r '[.[].t] | max | floor' backup-errores.json)
            echo "Tamano del JSON (bytes): $BYTES"
            echo "Rango de fechas: $(date -u -d "@$((DESDE_MS_EV/1000))" +"%Y-%m-%dT%H:%M:%SZ") a $(date -u -d "@$((HASTA_MS_EV/1000))" +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          rm -f backup-errores.json
