name: Verificacion QA - descarga de plantilla en produccion

# Disparo manual unicamente. Reutiliza EXACTAMENTE el mismo mecanismo que
# deploy.yml/seed-demo.yml (rol OIDC, apertura temporal del puerto 22 solo
# para la IP de este runner, secrets de SSH ya auditados) para no abrir
# ningun acceso nuevo.
#
# Que hace: crea un usuario TEMPORAL directo en la base de datos de
# produccion (nunca via la API, para no dejar una fila en el historial de
# auditoria como si lo hubiera creado un humano), con el permiso minimo
# `cargarDatos` (nunca rol admin), usa Playwright contra la URL real de
# produccion para descargar la plantilla oficial de Trafico con ese usuario,
# confirma que es byte a byte identica a la del repo, y borra el usuario
# temporal de inmediato.
#
# La contrasena del usuario temporal se genera en este mismo job, se
# enmascara con `::add-mask::` ANTES de usarse en ningun otro paso, y nunca
# se imprime en ningun log — ni este workflow ni el script de verificacion
# la muestran en ningun momento.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TEMP_USER: verificacion_temporal_qa_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Genera la contrasena AQUI, en el runner, y la enmascara de
      # inmediato (::add-mask::) antes de que cualquier otro paso la toque.
      # Desde este punto, GitHub Actions redacta esta cadena en TODO el log
      # del job de aqui en adelante, la produzca el paso que la produzca.
      - name: Generar contrasena temporal (enmascarada de inmediato)
        id: genpw
        run: |
          set -euo pipefail
          PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 22)"
          echo "::add-mask::$PW"
          echo "password=$PW" >> "$GITHUB_OUTPUT"
          echo "Contrasena temporal generada (no se imprime)."

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # Inserta el usuario temporal DIRECTO en la tabla users (nunca via
      # POST /api/users) -- asi no genera una fila CREADO en el historial
      # de auditoria como si lo hubiera hecho un administrador real. Rol
      # CALIDAD (nunca ADMIN) + perms.cargarDatos=true: el minimo permiso
      # que exige el boton de descarga (canLoadData), nada mas.
      - name: Crear usuario temporal directo en la base de datos
        uses: appleboy/ssh-action@v1
        env:
          TEMP_PW: ${{ steps.genpw.outputs.password }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TEMP_PW
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T -e TEMP_PW="$TEMP_PW" -e TEMP_USER="${{ env.TEMP_USER }}" app node -e '
              const db = require("./db");
              const bcrypt = require("bcryptjs");
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const d = new Date();
              const now = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
              const hash = bcrypt.hashSync(process.env.TEMP_PW, 10);
              db.prepare(
                "INSERT INTO users (nombre, user, rol, active, password_hash, perms, asesorCampana, createdAt) VALUES (?,?,?,1,?,?,NULL,?)"
              ).run("Verificacion Temporal QA (borrar automatico)", process.env.TEMP_USER, "CALIDAD", hash, JSON.stringify({ cargarDatos: true }), now);
              const row = db.prepare("SELECT id, user, rol, createdAt FROM users WHERE user = ?").get(process.env.TEMP_USER);
              console.log("USUARIO_TEMPORAL_CREADO " + JSON.stringify(row));
            '

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verificar la descarga real en produccion con el usuario temporal
        id: verificacion
        env:
          TEMP_PW: ${{ steps.genpw.outputs.password }}
          PROD_URL: https://inconexionpruebasclaude.duckdns.org
        run: node .github/scripts/verificar-plantilla-produccion.js

      # Corre SIEMPRE (incluso si la verificacion de arriba fallo), para
      # nunca dejar el usuario temporal vivo en produccion.
      - name: Borrar el usuario temporal (siempre, pase lo que pase arriba)
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T -e TEMP_USER="${{ env.TEMP_USER }}" app node -e '
              const db = require("./db");
              const info = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_USER);
              console.log("USUARIO_TEMPORAL_BORRADO " + JSON.stringify({ filasBorradas: info.changes, at: new Date().toISOString() }));
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
