name: Carga REAL - Trafico de WhatsApp ORLANT (produccion)

# Disparo manual unicamente. Reutiliza EXACTAMENTE el mismo mecanismo que
# deploy.yml/verificar-graficas-orlant-produccion.yml/qa-datos-prueba-trafico-salida-orlant.yml
# (rol OIDC, apertura temporal del puerto 22 solo para la IP de este runner).
#
# Fase 56: a diferencia de qa-datos-prueba-trafico-salida-orlant.yml, esto
# NO es un dato de prueba -- son los datos REALES de Trafico de WhatsApp de
# ORLANT (5 colas, agosto 2026: FONOAUDIOLOGIA/ORLANT 3P/ORLANT GENERAL/
# FONIATRIA/AUDIFONOS), ya verificados de punta a punta contra la plantilla
# real en las Fases 50-55 (solo contra un entorno de verificacion hasta
# ahora, a proposito, para no escribir sobre produccion durante las
# pruebas). Este workflow hace la carga real que debe quedar en produccion
# para uso real -- por eso NO hay paso de borrado de los datos cargados
# (solo el usuario temporal se borra siempre, igual que los demas).
#
# El script primero LEE el estado actual (Paso 1) y solo sube el archivo si
# hace falta (vacio o no coincide exacto con la referencia real) -- si ya
# estaba cargado y correcto, no vuelve a escribir nada. La carga en si es
# un upsert por (campana, colaWhatsapp, fechaInicio, fechaFin): repetirla
# nunca duplica.
#
# SOLO toca la tabla trafico_whatsapp para ORLANT, por el modal real
# "Cargar Datos de Dashboards" (nunca un atajo directo a la base de datos
# para el dato en si -- el usuario temporal si se crea/borra directo en la
# base de datos, igual que en los demas workflows de este tipo).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  cargar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TEMP_ADMIN_USER: carga_real_wpp_orlant_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar contrasena temporal (enmascarada de inmediato)
        id: genpw
        run: |
          set -euo pipefail
          PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 22)"
          echo "::add-mask::$PW"
          echo "admin_password=$PW" >> "$GITHUB_OUTPUT"
          echo "Contrasena temporal generada (no se imprime)."

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # Insertado DIRECTO en la tabla users (nunca via POST /api/users) --
      # asi no deja una fila CREADO en el historial de auditoria como si lo
      # hubiera hecho un administrador real. Rol ADMIN: openGenericDashboard
      # es isFullAdmin-bypass, no depende del scoping por cliente; subir la
      # carga es canLoadData (ADMIN ya lo tiene).
      - name: Crear el usuario temporal directo en la base de datos
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_PW: ${{ steps.genpw.outputs.admin_password }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_PW
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e ADMIN_PW="$ADMIN_PW" \
              -e TEMP_ADMIN_USER="${{ env.TEMP_ADMIN_USER }}" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const bcrypt = require("bcryptjs");
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const d = new Date();
              const now = pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
              db.prepare(
                "INSERT INTO users (nombre, user, rol, active, password_hash, perms, asesorCampana, createdAt) VALUES (?,?,?,1,?,?,NULL,?)"
              ).run("Carga Real Trafico WhatsApp ORLANT (borrar automatico)", process.env.TEMP_ADMIN_USER, "ADMIN", bcrypt.hashSync(process.env.ADMIN_PW, 10), JSON.stringify({}), now);
              console.log("USUARIO_TEMPORAL_CREADO " + process.env.TEMP_ADMIN_USER);
            '

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Leer estado actual, subir el archivo real si hace falta, y verificar
        id: carga
        env:
          TEMP_ADMIN_PW: ${{ steps.genpw.outputs.admin_password }}
          PROD_URL: https://inconexionpruebasclaude.duckdns.org
          ARTIFACTS_DIR: ${{ runner.temp }}/carga-real-whatsapp-orlant
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          node .github/scripts/carga-real-trafico-whatsapp-orlant-produccion.js

      - name: Subir capturas y el detalle de la comparacion como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-real-whatsapp-orlant-${{ github.run_id }}
          path: ${{ runner.temp }}/carga-real-whatsapp-orlant/**
          retention-days: 90
          if-no-files-found: warn

      # Corre SIEMPRE. Solo borra el usuario temporal -- NUNCA toca ninguna
      # fila de trafico_whatsapp: los datos reales cargados en este job
      # deben quedar en produccion, esa es la razon de ser de esta fase.
      - name: Borrar el usuario temporal (siempre, pase lo que pase arriba)
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_ADMIN_USER="${{ env.TEMP_ADMIN_USER }}" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const u = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_ADMIN_USER);
              console.log("USUARIO_TEMPORAL_BORRADO " + JSON.stringify({ filasBorradas: u.changes }));
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
