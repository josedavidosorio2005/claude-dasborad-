name: Usuario temporal - carga trafico real ORLANT (agosto 2026)

# Disparo manual unicamente. Reutiliza EXACTAMENTE el mismo mecanismo que
# deploy.yml/qa-datos-prueba-trafico-salida-orlant.yml (rol OIDC, apertura
# temporal del puerto 22 solo para la IP de este runner, usuario ADMIN
# insertado DIRECTO en la base de datos, nunca via la API).
#
# Fase 36 (2026-09-18): InCo mando el archivo real de trafico de ORLANT de
# agosto 2026. La carga en si (subir el .xlsx, revisar el mapeo de skills,
# verificar en pantalla) se hace con Playwright LOCAL contra produccion
# real -- el archivo del cliente NUNCA sale de la maquina local ni se
# comitea al repo, asi que no puede parsearse/subirse desde un runner de
# GitHub Actions. Este workflow SOLO crea o borra el usuario ADMIN
# temporal que esa sesion local necesita para autenticarse.
#
# La contrasena en si NUNCA pasa por aqui: se genera en la maquina local,
# se hashea ahi mismo (server/hash-password.js, el mismo script que ya usa
# el equipo para esto) y solo su HASH bcrypt (irreversible) se manda como
# input de `accion: crear`. Al terminar, `accion: borrar` elimina la fila
# por completo -- no queda ninguna cuenta ni contrasena temporal viva.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'crear o borrar el usuario temporal'
        required: true
        type: choice
        options: [crear, borrar]
      usuario:
        description: 'Nombre de usuario temporal (mismo valor en crear y borrar)'
        required: true
      hash_password:
        description: 'Hash bcrypt de la contrasena (SOLO para accion=crear; jamas la contrasena en texto plano)'
        required: false

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  gestionar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Abrir SSH (22) para la IP de este runner
        id: fw
        env:
          LS_INSTANCE: inconexion-prod
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "IP del runner: $RUNNER_IP"
          BEFORE="$(aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates' --output json | jq -c .)"
          { echo 'before<<__FW__'; echo "$BEFORE"; echo '__FW__'; } >> "$GITHUB_OUTPUT"
          NEW="$(echo "$BEFORE" | jq -c --arg ip "$RUNNER_IP/32" '
            map({
              fromPort, toPort, protocol,
              cidrs: (if (.fromPort == 22 and .protocol == "tcp")
                        then ((.cidrs // []) + [$ip] | unique)
                        else (.cidrs // []) end),
              ipv6Cidrs: (.ipv6Cidrs // []),
              cidrListAliases: (.cidrListAliases // [])
            })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"

      # Rol ADMIN (isFullAdmin): necesario para abrir el dashboard de ORLANT
      # sin depender del scoping por cliente, ademas de canLoadData (subir
      # Trafico, editar el mapeo de skills).
      - name: Crear el usuario temporal directo en la base de datos
        if: ${{ inputs.accion == 'crear' }}
        uses: appleboy/ssh-action@v1
        env:
          TEMP_USER: ${{ inputs.usuario }}
          TEMP_HASH: ${{ inputs.hash_password }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TEMP_USER,TEMP_HASH
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_USER="$TEMP_USER" -e TEMP_HASH="$TEMP_HASH" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const d = new Date();
              const now = pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
              db.prepare(
                "INSERT INTO users (nombre, user, rol, active, password_hash, perms, asesorCampana, createdAt) VALUES (?,?,?,1,?,?,NULL,?)"
              ).run("Carga trafico real ORLANT ago-2026 (temporal, borrar automatico -- Fase 36)", process.env.TEMP_USER, "ADMIN", process.env.TEMP_HASH, JSON.stringify({}), now);
              console.log("USUARIO_TEMPORAL_CREADO " + process.env.TEMP_USER);
            '

      - name: Borrar el usuario temporal directo en la base de datos
        if: ${{ inputs.accion == 'borrar' }}
        uses: appleboy/ssh-action@v1
        env:
          TEMP_USER: ${{ inputs.usuario }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TEMP_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/inconexion
            docker compose exec -T \
              -e TEMP_USER="$TEMP_USER" \
              -e JWT_SECRET="dummy-no-usado-verificacion-qa-temporal-32chars" \
              -e MASTER_ADMIN_PASSWORD_HASH='$2a$10$./ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxy' \
              -e CORS_ORIGIN="https://inconexionpruebasclaude.duckdns.org" \
              app node -e '
              const db = require("./db");
              const u = db.prepare("DELETE FROM users WHERE user = ?").run(process.env.TEMP_USER);
              console.log("USUARIO_TEMPORAL_BORRADO " + JSON.stringify({ filasBorradas: u.changes }));
            '

      - name: Cerrar SSH (22) — revertir el firewall al estado previo
        if: always() && steps.fw.outputs.before != ''
        env:
          LS_INSTANCE: inconexion-prod
          FW_BEFORE: ${{ steps.fw.outputs.before }}
        run: |
          set -euo pipefail
          NEW="$(printf '%s' "$FW_BEFORE" | jq -c '
            map({ fromPort, toPort, protocol,
                  cidrs: (.cidrs // []),
                  ipv6Cidrs: (.ipv6Cidrs // []),
                  cidrListAliases: (.cidrListAliases // []) })')"
          aws lightsail put-instance-public-ports \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" --port-infos "$NEW"
          echo "Puerto 22 tras revertir:"
          aws lightsail get-instance-port-states \
            --region "$AWS_REGION" --instance-name "$LS_INSTANCE" \
            --query 'portStates[?fromPort==`22`].cidrs' --output json
