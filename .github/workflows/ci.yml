name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Fase 102 (endurecimiento, repo publico): ningun job de este workflow
# necesita escribir en el repo -- solo checkout + npm test / docker build.
# Sin este bloque, GITHUB_TOKEN usa el default del repo (puede ser mas
# amplio de lo necesario); esto lo deja explicito y minimo.
permissions:
  contents: read

# Fase 96: un push nuevo cancela la corrida vieja del MISMO PR/rama, para no
# gastar minutos en una version ya obsoleta -- pero nunca en main, porque
# deploy.yml se dispara con workflow_run: workflows: ["CI"] sobre main, y
# cancelar esa corrida dejaria sin disparar el deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Fase 96: un job colgado (Node 18/20 sin binario prebuilt de
    # better-sqlite3 -- ver server/package.json "engines") falla rapido en
    # vez de quedarse 20+ minutos.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        # Fase 96: solo Node 22, la version de produccion (server/Dockerfile:
        # node:22-bookworm). Node 18 y 20 ya no tienen soporte upstream y
        # eran los que se colgaban -- better-sqlite3@12 solo trae binario
        # prebuilt para 20.x/22.x/23.x/24.x/25.x/26.x, pero en la practica
        # solo 22.x lo resolvia al instante (~3s); 18.x fallaba el chequeo de
        # engines y 20.x igual tardaba ~1m30s por instalacion, contra los 3s
        # de Node 22 -- confirmado en los logs de una corrida real de la
        # Fase 95 (job "Instalar dependencias").
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        # Los helpers de test (tests/helpers.js) generan sus propios secretos
        # dummy y una BD SQLite temporal, asi que no hace falta configurar nada.
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen Docker
        run: docker build -f server/Dockerfile -t inconexion:ci .
      - name: Smoke test del contenedor (arranca y responde /api/health)
        run: |
          HASH=$(docker run --rm inconexion:ci node -e "console.log(require('bcryptjs').hashSync('ci-smoke',10))")
          SECRET=$(head -c 48 /dev/urandom | base64 | tr -dc a-zA-Z0-9 | head -c 48)
          docker run -d --name inconexion-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$SECRET" \
            -e MASTER_ADMIN_PASSWORD_HASH="$HASH" \
            -e CORS_ORIGIN=https://example.com \
            inconexion:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then echo; echo "OK"; exit 0; fi
            sleep 3
          done
          echo "El contenedor no respondio a /api/health"; docker logs inconexion-ci; exit 1
