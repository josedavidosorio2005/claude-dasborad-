name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        # Los helpers de test (tests/helpers.js) generan sus propios secretos
        # dummy y una BD SQLite temporal, asi que no hace falta configurar nada.
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen Docker
        run: docker build -f server/Dockerfile -t inconexion:ci .
      - name: Smoke test del contenedor (arranca y responde /api/health)
        run: |
          HASH=$(docker run --rm inconexion:ci node -e "console.log(require('bcryptjs').hashSync('ci-smoke',10))")
          SECRET=$(head -c 48 /dev/urandom | base64 | tr -dc a-zA-Z0-9 | head -c 48)
          docker run -d --name inconexion-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$SECRET" \
            -e MASTER_ADMIN_PASSWORD_HASH="$HASH" \
            -e CORS_ORIGIN=https://example.com \
            inconexion:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then echo; echo "OK"; exit 0; fi
            sleep 3
          done
          echo "El contenedor no respondio a /api/health"; docker logs inconexion-ci; exit 1
