<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sin conexión</title>
<style>
  html,body{margin:0;height:100%;background:#0d4a5e;color:#e8f4f7;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:24px;max-width:360px}
  .icon{font-size:48px;margin-bottom:14px;opacity:.9}
  h1{font-size:1.3rem;margin:0 0 10px}
  p{font-size:0.95rem;opacity:.85;margin:0 0 24px;line-height:1.45}
  button{background:#1a7a9e;color:#fff;border:none;border-radius:8px;
    padding:12px 32px;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{background:#1f8bb3}
  button:active{background:#155f7c}
</style>
</head>
<body>
  <!-- Pantalla nativa de "sin conexión" del cliente de escritorio
       (desktop-app/), reemplaza la página de error genérica de
       Chromium/Electron. No forma parte del sitio (public/): vive como
       archivo local de la app y solo se muestra cuando main.js detecta un
       error de red real (did-fail-load con un net-error de conectividad),
       nunca para errores 4xx/5xx del servidor. El botón navega de vuelta a
       la URL real de producción. -->
  <div class="box">
    <div class="icon">&#128246;</div>
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con InConexion Platform. Verifica tu conexión a internet e intenta de nuevo.</p>
    <button id="retry">Reintentar</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      window.location.href = 'https://inconexionpruebasclaude.duckdns.org/';
    });
  </script>
</body>
</html>
